<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tactical Mind 3D</title>
  <link rel="stylesheet" href="style.css">
  <script src="matrix.js" defer></script>
  <script src="game.js" defer></script>
  <script src="renderer.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <h1>Tactical Mind 3D</h1>
    <div class="toolbar">
      <p id="turn" role="status"></p>
      <button id="pass" disabled>Pass turn</button>
      <button id="reset" disabled>Reset</button>
    </div>
    <canvas id="board" aria-label="3D tactical board with red and blue pieces"></canvas>
    <p id="error" role="alert" hidden></p>
  </main>
</body>
</html>
